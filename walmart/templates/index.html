<!DOCTYPE html>
<html>
<head>
    <title>Walmart Forecast Dashboard</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        canvas { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <h1> Walmart Sales Forecast</h1>
    <form method="get" action="/">
        Forecast Horizon:
        <select name="days" onchange="this.form.submit()">
            <option value="30" {% if days == 30 %}selected{% endif %}>30 Days</option>
            <option value="90" {% if days == 90 %}selected{% endif %}>90 Days</option>
            <option value="180" {% if days == 180 %}selected{% endif %}>180 Days</option>
        </select>
    </form>

    <canvas id="forecastChart"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const data = {
            labels: {{ plot_data|map(attribute='ds')|list|tojson }},
            datasets: [{
                label: "Predicted Sales",
                data: {{ plot_data|map(attribute='yhat')|list|tojson }},
                fill: false,
                borderColor: "blue",
                tension: 0.1
            }]
        };

        new Chart(document.getElementById("forecastChart"), {
            type: "line",
            data: data,
            options: {
                responsive: true,
                plugins: { legend: { display: true } },
                scales: {
                    x: { title: { display: true, text: "Date" } },
                    y: { title: { display: true, text: "Sales" } }
                }
            }
        });
    </script>
</body>
</html>
